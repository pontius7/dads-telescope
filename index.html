<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      No `user-scalable=no` / `maximum-scale`: blocking zoom breaks screen
      magnification for low-vision users. The 3D canvas already sets
      `touch-action: none`, so pinching the sky zooms the sky rather than the
      document, and the overlay text stays magnifiable.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="What is worth observing tonight through an 8-inch Dobsonian from your location, and exactly which eyepiece, magnification and filter to use."
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Telescope" />
    <title>Dad's Telescope</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
